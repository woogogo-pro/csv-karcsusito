name: CSV Karcsusito Automatizmus

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repó kiírása
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Script futtatása
        run: python script.py

      - name: Módosítások mentése és feltöltése
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add karcsusitott_feed.csv
          git commit --allow-empty -m "Automatikus CSV frissites - $(date +'%Y-%m-%d %H:%M')"
          git push

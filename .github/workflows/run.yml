name: CSV Karcsusito Automatizmus

on:
  schedule:
    - cron: '0 * * * *'  # Minden óra 00. percében lefut
  workflow_dispatch:      # Manuális indítás gomb

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repó kiírása
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Script futtatása
        run: python script.py

      - name: Módosítások mentése és feltöltése
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add karcsusitott_feed.csv
          git commit --allow-empty -m "Automatikus CSV frissites - $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Értesítés küldése hiba vagy siker esetén
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "CSV Frissítés Státusz: ${{ job.status }}"
          to: az_te_email_cimed@gmail.com
          from: GitHub Actions Auto
          body: |
            A CSV karcsúsító automatizmus lefutott.
            Státusz: ${{ job.status }}
            Időpont: $(date)

name: CSV Karcsusito Automatizmus

on:
  schedule:
    # 3 óránként fut le automatikusan
    - cron: '0 */3 * * *'
  # Lehetővé teszi, hogy gombnyomásra is manuálisan tesztelhessük:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v3

      - name: Python környezet beállítása
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Szükséges modulok telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Python script futtatása
        run: python script.py

      - name: Karcsúsított CSV kimentése a tárolóba
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add karcsusitott_feed.csv
          git commit -m "Automatikus CSV frissites" || exit 0
          git push

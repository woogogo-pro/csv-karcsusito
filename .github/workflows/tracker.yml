name: Hianyzo Termekek Nyomonkovetese

on:
  schedule:
    - cron: '30 23 * * *'  # Minden nap 23:30-kor fut le
  workflow_dispatch:        # Kézzel is indítható

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Repó kiírása
        uses: actions/checkout@v4

      - name: Python környezet beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Függőségek telepítése
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Tracker script futtatása
        run: python tracker.py

      - name: Bővített CSV frissítése
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hianyoznak-bovitett-info.csv
          git commit --allow-empty -m "Hianyzo termekek statisztika frissites - $(date +'%Y-%m-%d')"
          git push
